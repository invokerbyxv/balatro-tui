[project]
name = "balatro-tui"
version = "0.1.0"
description = "A text-based recreation of the card game Balatro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "textual-dev>=1.8.0",
]

[project.scripts]
balatro = "balatro_tui.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
